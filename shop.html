<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Products — AuroraBD</title>
  <meta name="description" content="Shop Aurora perfumes for men, women and unisex, plus skincare. Sizes from 10ml, flat ৳100 delivery across Bangladesh, cash on delivery.">
  <meta name="theme-color" content="#8b2f39">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body data-page="collection">

  <div id="site-header"></div>

  <main id="main">
    <div class="container" id="collectionHead"></div>

    <div class="container" style="padding-bottom:88px">
      <div class="layout" id="collectionMain">
        <aside class="filters-side" id="filtersSide" aria-label="Filters"></aside>
        <div>
          <div class="toolbar">
            <button class="toolbar-btn mobile-only" id="openFilters">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
              Filter <span class="n"></span>
            </button>
            <span class="count" id="resultCount" aria-live="polite"></span>
            <label class="sort">
              <span class="lbl">Sort by</span>
              <select id="sortSelect" aria-label="Sort products">
                <option value="featured">Featured</option>
                <option value="best">Best selling</option>
                <option value="new">Newest</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="name">Name: A–Z</option>
              </select>
            </label>
          </div>
          <div class="active-filters" id="activeFilters"></div>
          <div class="grid cols-3" id="collectionGrid"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Mobile filter drawer -->
  <aside class="drawer left" id="filterDrawer" aria-label="Filters" aria-hidden="true">
    <div class="drawer-head">
      <h2>Filter</h2>
      <button class="icon-btn" data-close aria-label="Close filters"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="drawer-body" id="filterDrawerBody"></div>
    <div class="drawer-foot" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn btn-outline" data-clear-filters>Clear</button>
      <button class="btn" data-close>Show results</button>
    </div>
  </aside>

  <div id="site-footer"></div>

  <script src="js/data.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
