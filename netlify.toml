# Aurora — static site, no build step required
[build]
  publish = "."

# Long-cache immutable assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS (prices live in js/data.js) — always revalidate so edits show up immediately
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Clean collection / product URLs, e.g. /collections/perfume-men, /products/creed-aventus
[[redirects]]
  from = "/collections"
  to = "/shop.html"
  status = 301

[[redirects]]
  from = "/collections/:slug"
  to = "/shop.html?c=:slug"
  status = 301

[[redirects]]
  from = "/products/:slug"
  to = "/product.html?p=:slug"
  status = 301
